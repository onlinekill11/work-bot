# Blueprint для Render: New -> Blueprint -> подключить этот репозиторий.
services:
  - type: web
    name: work-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN        # токен от @BotFather
        sync: false
      - key: DATABASE_URL     # строка подключения Neon (postgresql://...?sslmode=require)
        sync: false
      - key: KEEPALIVE_URL    # https://work-bot-xxxx.onrender.com/health
        sync: false
      - key: ADMIN_USERNAME
        value: maximalusdt
      - key: BLOCK_PAY_MODE
        value: max
      - key: TZ_OFFSET
        value: "3"
      - key: PYTHON_VERSION
        value: "3.12.7"
